[workspace]
members = [
  "crates/uniffi-bindgen-haskell",
  "tests/fixture-rust",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1"
camino = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "=0.32.0"
uniffi_bindgen = "=0.32.0"
